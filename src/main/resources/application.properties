spring.application.name=quan-ly-de-tai
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Mặc định chạy bằng H2 (file) để chạy ngay; dùng MySQL: --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:file:./data/detai;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# Thư mục lưu báo cáo PDF (BR08)
app.upload-dir=uploads
