<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="vi"
      th:replace="~{fragments/shell :: layout('Duyệt đề tài', 'dot', ~{::section})}">
<body>
<section>
<div class="crumbs"><a th:href="@{/truong-khoa/dot}">Đợt đăng ký</a><span class="sep"></span><span th:text="${dot.tenDot}">Đợt</span></div>
<div class="page-head"><div><h1>Duyệt đề tài</h1>
    <p class="sub" th:text="${#lists.size(dsDeTai)} + ' đề tài, ' + ${#lists.size(dsDeTai.?[trangThai.name() == 'CHO_DUYET'])} + ' đang chờ duyệt. Đề tài được duyệt sẽ hiện cho sinh viên chọn.'">Tóm tắt</p></div></div>
<div class="panel">
    <div class="table-wrap" th:if="${!#lists.isEmpty(dsDeTai)}"><table class="data-table" data-grid>
        <thead><tr><th>Đề tài</th><th>Bộ môn</th><th>Giảng viên hướng dẫn</th><th>Trạng thái</th><th>Nhóm đăng ký</th><th></th></tr></thead>
        <tbody>
        <tr th:each="d : ${dsDeTai}">
            <td style="min-width:300px"><div class="cell-title" th:text="${d.tenDeTai}">Tên đề tài</div><div class="clamp pre-wrap" th:text="${d.moTa}">Mô tả</div></td>
            <td th:text="${d.boMon.tenBoMon}">Bộ môn</td>
            <td th:text="${d.tenGvhds}">Giảng viên</td>
            <td><span class="chip" th:classappend="'chip-' + ${d.trangThai.mau}" th:text="${d.trangThai.nhan}">Trạng thái</span>
                <div class="sub-text mt-1" th:if="${d.lyDoTuChoi != null}" th:text="'Lý do: ' + ${d.lyDoTuChoi}">Lý do</div></td>
            <td th:text="${d.nhom != null} ? ${d.nhom.tenNhom} : 'Chưa có'">Nhóm</td>
            <td style="min-width:230px">
                <div th:if="${d.trangThai.name() == 'CHO_DUYET'}">
                    <form class="d-inline" th:action="@{/truong-khoa/de-tai/{id}/duyet(id=${d.id})}" method="post">
                        <button class="btn btn-sm btn-success"><i class="bi bi-check-lg"></i>Duyệt</button></form>
                    <details class="reject d-inline-block ms-1"><summary class="btn btn-sm btn-outline-danger">Từ chối</summary>
                        <form class="d-flex gap-1" th:action="@{/truong-khoa/de-tai/{id}/tu-choi(id=${d.id})}" method="post">
                            <input name="lyDo" class="form-control form-control-sm" placeholder="Nêu lý do từ chối" required>
                            <button class="btn btn-sm btn-danger">Gửi</button></form></details>
                </div></td></tr>
        </tbody></table></div>
    <div class="empty" th:if="${#lists.isEmpty(dsDeTai)}"><i class="bi bi-journal-text"></i><strong>Chưa có đề tài nào</strong>Đề tài do giảng viên đăng ký sẽ hiện ở đây để bạn duyệt.</div>
</div>
</section>
</body>
</html>
