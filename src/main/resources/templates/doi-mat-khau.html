<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="vi"
      th:replace="~{fragments/shell :: layout('Đổi mật khẩu', 'home', ~{::section})}">
<body>
<section>
<div class="page-head"><div><h1>Đổi mật khẩu</h1><p class="sub">Mật khẩu mới cần tối thiểu 6 ký tự.</p></div></div>
<form th:action="@{/doi-mat-khau}" th:object="${form}" method="post" class="panel" style="max-width:520px">
    <div class="panel-body">
        <div class="mb-3"><label class="form-label" for="matKhauCu">Mật khẩu hiện tại</label>
            <input type="password" class="form-control" th:field="*{matKhauCu}" autocomplete="current-password">
            <div class="field-error" th:if="${#fields.hasErrors('matKhauCu')}" th:errors="*{matKhauCu}"></div></div>
        <div class="mb-3"><label class="form-label" for="matKhauMoi">Mật khẩu mới</label>
            <input type="password" class="form-control" th:field="*{matKhauMoi}" autocomplete="new-password">
            <div class="field-error" th:if="${#fields.hasErrors('matKhauMoi')}" th:errors="*{matKhauMoi}"></div></div>
        <div><label class="form-label" for="nhapLai">Nhập lại mật khẩu mới</label>
            <input type="password" class="form-control" th:field="*{nhapLai}" autocomplete="new-password">
            <div class="field-error" th:if="${#fields.hasErrors('nhapLai')}" th:errors="*{nhapLai}"></div></div>
    </div>
    <div class="panel-foot"><button class="btn btn-primary" type="submit">Đổi mật khẩu</button>
        <a class="btn btn-light" th:href="@{/}">Hủy</a></div>
</form>
</section>
</body>
</html>
