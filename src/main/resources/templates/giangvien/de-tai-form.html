<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="vi"
      th:replace="~{fragments/shell :: layout('Đề tài', 'detai', ~{::section})}">
<body>
<section>
<div class="crumbs"><a th:href="@{/giang-vien/de-tai}">Đề tài của tôi</a><span class="sep"></span><span th:text="${tieuDe}">Đề tài</span></div>
<div class="page-head"><div><h1 th:text="${tieuDe}">Đề tài</h1>
    <p class="sub" th:text="'Đợt: ' + ${dot.tenDot} + ' (' + ${dot.loai.nhan} + ')'">Đợt</p></div></div>
<form th:action="@{${action}}" th:object="${form}" method="post" class="panel" style="max-width:820px">
    <input type="hidden" th:field="*{dotId}">
    <div class="panel-body">
        <div class="form-section"><h3>Nội dung đề tài</h3><p>Mô tả rõ mục tiêu và phạm vi để sinh viên chọn đúng đề tài.</p>
            <div class="mb-3"><label class="form-label" for="tenDeTai">Tên đề tài</label><input class="form-control" th:field="*{tenDeTai}">
                <div class="field-error" th:if="${#fields.hasErrors('tenDeTai')}" th:errors="*{tenDeTai}"></div></div>
            <div><label class="form-label" for="moTa">Mô tả</label><textarea class="form-control" rows="7" th:field="*{moTa}"></textarea>
                <div class="field-error" th:if="${#fields.hasErrors('moTa')}" th:errors="*{moTa}"></div></div></div>
        <div class="form-section"><h3>Bộ môn và hướng dẫn</h3><p>Mỗi đề tài có một hoặc hai giảng viên hướng dẫn, bạn là giảng viên thứ nhất.</p>
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label" for="boMonId">Bộ môn</label>
                    <select class="form-select" th:field="*{boMonId}"><option value="">Chọn bộ môn</option>
                        <option th:each="b : ${boMons}" th:value="${b.id}" th:text="${b.tenBoMon}">Bộ môn</option></select>
                    <div class="field-error" th:if="${#fields.hasErrors('boMonId')}" th:errors="*{boMonId}"></div></div>
                <div class="col-md-6"><label class="form-label" for="gvhd2Id">Giảng viên hướng dẫn thứ hai</label>
                    <select class="form-select" th:field="*{gvhd2Id}"><option value="">Không có</option>
                        <option th:each="g : ${dsGv}" th:value="${g.id}" th:text="${g.nhan}">Giảng viên</option></select></div>
            </div></div>
    </div>
    <div class="panel-foot"><button class="btn btn-primary" type="submit">Lưu đề tài</button> <a class="btn btn-light" th:href="@{/giang-vien/de-tai}">Hủy</a></div>
</form>
</section>
</body>
</html>
